
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CivicConnect | Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #eef2f7;
            padding: 35px 12px;
        }
        .register-card {
            max-width: 600px;
            margin: auto;
            border: 0;
            border-radius: 16px;
        }
        .brand { color: #176b55; font-weight: 700; }
        .form-control { margin-bottom: 12px; }
        .errorlist { color: #dc3545; }
    </style>
</head>
<body>
<div class="card register-card shadow p-4">
    <div class="text-center mb-3">
        <h2 class="brand">CivicConnect</h2>
        <p class="text-muted">Create your citizen account</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}

                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-success w-100">
            Register
        </button>
    </form>

    <p class="text-center mt-3 mb-0">
        Already registered?
        <a href="{% url 'login' %}">Login</a>
    </p>
</div>
</body>
</html>
